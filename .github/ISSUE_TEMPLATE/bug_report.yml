name: Bug report
description: Something doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public and stay public.** Don't paste personal data, keys or your user name.
        Security problems belong in a [private report](https://github.com/FynnXland/FluneIt/security/advisories/new).
        German is welcome too.
  - type: input
    id: version
    validations: {required: true}
    attributes:
      label: Version
      description: "Where to find it: settings, page *Über* (about)."
  - type: dropdown
    id: os
    validations: {required: true}
    attributes:
      label: Operating system
      options: ["Windows 11", "Windows 10", "Linux (experimental)", "Other"]
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Volume keys and overlay", "Tray mixer", "Effects", "Media keys", "Autostart", "Settings window", "Other"]
  - type: textarea
    id: steps
    validations: {required: true}
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: behaviour
    validations: {required: true}
    attributes:
      label: Expected and actual behaviour
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      render: text
      description: |
        Log file: settings → *Über* → *Log-Datei öffnen* (usually `%LOCALAPPDATA%\Fluneit\fluneit.log`).
        Copy from the last line with `gestartet` down to the error.
        **The log can contain your data:** lines like `Effekt-Engine laeuft: …` name your audio devices,
        `Regel konnte nicht angewendet werden: …` names apps, and error messages contain folder paths with your user name.
        This list is not complete. Replace such content with `[redacted]`.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: "I removed or redacted personal content, my user name in paths and any keys from this report."
          required: true
